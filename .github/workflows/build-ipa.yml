name: build-ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: xcode select
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: xcode version
        run: xcodebuild -version

      - name: python version
        run: python3 --version

      - name: scaffold + build + pack
        run: python3 build_stealer.py

      - name: list build
        if: always()
        run: find build -maxdepth 5 -type f 2>/dev/null | head -200

      - name: upload ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SystemHelper-ipa
          path: build/SystemHelper.ipa
          if-no-files-found: error

      - name: upload xcode log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-log
          path: |
            build/**/*.log
            build/dd/Logs/**
          if-no-files-found: ignore
